<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аналитика продаж | Табачный магазин</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #000000;
      --gray-900: #111827;
      --blue-600: #3b82f6;
      --blue-700: #2563eb;
      --gold: #d4af37;
      --bronze: #cd7f32;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--dark) 0%, #0f172a 100%);
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
      transform: rotate(30deg);
      animation: float 12s linear infinite;
      z-index: -1;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -50%;
      right: -50%;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
      transform: rotate(-30deg);
      animation: float 15s linear infinite reverse;
      z-index: -1;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    header {
      position: relative;
      z-index: 10;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo svg {
      width: 1.5rem;
      height: 1.5rem;
      fill: white;
    }

    nav a {
      font-weight: 500;
      color: #cbd5e1;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: all 0.3s;
    }

    nav a:hover, nav a.active {
      color: #fff;
      background: rgba(59, 130, 246, 0.1);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue-600), var(--blue-700));
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      border: none;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5);
    }

    .hero {
      padding: 4rem 2rem;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #fff, #e5e7eb);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      margin-bottom: 1rem;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin: 2rem 0;
    }

    .kpi-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .kpi-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .kpi-card .value {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 0.5rem 0;
    }

    .kpi-card .label {
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    footer {
      padding: 2rem;
      text-align: center;
      color: #647481;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 3rem;
      min-height: 80px;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 1rem;
      }
      .hero h1 {
        font-size: 1.8rem;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
    </svg>
    <span class="font-bold text-xl">Аналитика</span>
  </div>

  <nav>
    <a href="index.html">Главная</a>
    <a href="sales.html" class="active">Аналитика продаж</a>
    <a href="products.html">Аналитика товара</a>
    <a href="settings.html">Настройки</a>
  </nav>

  <button class="btn-primary" onclick="location.href='settings.html'">Настройки</button>
</header>

<main>
  <section class="hero">
    <h1>АНАЛИТИКА ПРОДАЖ</h1>
    <p>Детальный анализ выручки, прибыли и динамики по дням.</p>
  </section>

  <div class="kpi-grid" id="sales-data">
    <div class="kpi-card">
      <div class="value">Загрузка...</div>
      <div class="label">Выручка (последние 7 дней)</div>
    </div>
    <div class="kpi-card">
      <div class="value">Загрузка...</div>
      <div class="label">Прибыль</div>
    </div>
    <div class="kpi-card">
      <div class="value">Загрузка...</div>
      <div class="label">Чеков</div>
    </div>
    <div class="kpi-card">
      <div class="value">Загрузка...</div>
      <div class="label">Маржа</div>
    </div>
  </div>
</main>

<footer>
  <p>© 2026 Табачный магазин. Все права защищены.</p>
</footer>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('mySkladToken');
    if (!token) {
      alert('Токен не найден. Перейдите в Настройки.');
      location.href = 'settings.html';
      return;
    }

    const period = {
      from: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0] + ' 00:00:00',
      to: new Date().toISOString().split('T')[0] + ' 23:59:59'
    };

    try {
      const response = await fetch(`https://proxy.helsinkyofficial.workers.dev/sales?from=${encodeURIComponent(period.from)}&to=${encodeURIComponent(period.to)}`, {
        headers: {
          'token': token
        }
      });

      if (response.ok) {
        const data = await response.json();
        const rows = data.rows || [];

        let totalRevenue = 0;
        let totalProfit = 0;
        let totalChecks = 0;
        let avgMargin = 0;

        rows.forEach(row => {
          totalRevenue += row.sum || 0;
          totalChecks += 1;
        });

        document.querySelectorAll('#sales-data .kpi-card .value')[0].textContent = `${totalRevenue.toLocaleString('ru-RU')} ₽`;
        document.querySelectorAll('#sales-data .kpi-card .value')[1].textContent = '—';
        document.querySelectorAll('#sales-data .kpi-card .value')[2].textContent = totalChecks;
        document.querySelectorAll('#sales-data .kpi-card .value')[3].textContent = '—';
      } else {
        const error = await response.text();
        alert(`Ошибка: ${response.status} ${error}`);
      }
    } catch (err) {
      console.error(err);
      alert('Ошибка загрузки данных.');
    }

    const links = document.querySelectorAll('nav a');
    const activeLink = Array.from(links).find(a => a.getAttribute('href') === 'sales.html');
    if (activeLink) activeLink.classList.add('active');
  });
</script>
</body>
</html>
