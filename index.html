<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Аналитика | Табачный Магазин</title>

  <!-- Tailwind через CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-bg': '#0f0f23',
            'dark-panel': '#1a1a2e',
            'dark-card': '#16213e',
            'dark-accent': '#0f3460',
            'neon-blue': '#00ffff',
            'neon-purple': '#bf00ff',
            'neon-pink': '#ff00ff',
          },
          boxShadow: {
            'glow-md': '0 0 15px rgba(0, 255, 255, 0.2)',
            'glow-lg': '0 0 25px rgba(191, 0, 255, 0.3)',
            'inset-dark': 'inset 0 2px 4px rgba(0, 0, 0, 0.5)'
          },
          animation: {
            'pulse-glow': 'pulseGlow 2s infinite',
            'float-card': 'float 6s ease-in-out infinite',
            'glow-pulse': 'glowPulse 3s ease-in-out infinite',
            'shine': 'shine 3s infinite'
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            glowPulse: {
              '0%, 100%': { boxShadow: '0 0 15px rgba(0, 255, 255, 0.2)' },
              '50%': { boxShadow: '0 0 30px rgba(191, 0, 255, 0.4)' },
            },
            shine: {
              '0%': { backgroundPosition: '-100%' },
              '100%': { backgroundPosition: '100%' },
            }
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
      color: #e0e0e0;
      overflow-x: hidden;
    }
    
    .cyber-font {
      font-family: 'Orbitron', monospace;
    }

    .card-glow {
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.1), inset 0 2px 4px rgba(0, 0, 0, 0.5);
      transition: all 0.4s ease;
    }

    .card-glow:hover {
      box-shadow: 0 0 25px rgba(191, 0, 255, 0.4), inset 0 2px 4px rgba(0, 0, 0, 0.7);
      transform: translateY(-5px);
    }

    .btn-cyber {
      background: linear-gradient(90deg, #0f3460, #16213e, #0f3460);
      border: 1px solid #0f3460;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-cyber::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #00ffff, #bf00ff, #ff00ff, #00ffff);
      z-index: -1;
      border-radius: 12px;
      animation: shine 3s infinite;
      background-size: 400%;
    }

    .btn-cyber:hover {
      box-shadow: 0 0 20px rgba(191, 0, 255, 0.6);
      transform: scale(1.03);
    }

    .input-dark {
      background: linear-gradient(to bottom, #16213e, #0f0f23);
      border: 1px solid #0f3460;
      color: #e0e0e0;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .input-dark:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Header -->
<header class="p-6 bg-gradient-to-r from-[#0f0f23] to-[#1a1a2e] border-b border-[#0f3460] shadow-lg">
  <div class="max-w-7xl mx-auto">
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-[#0f3460] to-[#16213e] flex items-center justify-center border border-[#0f3460] shadow-lg">
        <span class="text-2xl cyber-font text-[#00ffff]">📊</span>
      </div>
      <div>
        <h1 class="text-3xl font-bold cyber-font text-transparent bg-clip-text bg-gradient-to-r from-[#00ffff] to-[#bf00ff]">
          АНАЛИТИКА ПРОДАЖ
        </h1>
        <p class="text-cyan-300 mt-1 text-sm">
          ТАБАЧНЫЙ МАГАЗИН • КОРПОРАТИВНАЯ СТАТИСТИКА
        </p>
      </div>
    </div>
  </div>
</header>

<main class="flex-1 p-6 max-w-7xl mx-auto w-full">
  <!-- Controls -->
  <section class="mb-8 bg-gradient-to-br from-[#16213e] to-[#0f0f23] p-6 rounded-2xl border border-[#0f3460] shadow-lg card-glow">
    <div class="flex flex-wrap items-center gap-6">
      <div class="flex items-center gap-4">
        <label class="text-cyan-300 font-medium cyber-font">ПЕРИОД:</label>
        <div class="flex items-center gap-3">
          <input type="date" id="start-date" class="input-dark p-3 rounded-xl w-48" />
          <span class="text-purple-400 font-bold text-lg">—</span>
          <input type="date" id="end-date" class="input-dark p-3 rounded-xl w-48" />
        </div>
      </div>
      <button id="apply-btn" class="btn-cyber text-white px-8 py-3 rounded-xl font-bold cyber-font relative z-10 overflow-hidden">
        ПРИМЕНИТЬ
      </button>
    </div>
  </section>

  <!-- Metrics Grid -->
  <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <div class="card-glow bg-gradient-to-br from-[#0f3460] to-[#16213e] rounded-2xl p-6 border border-[#0f3460] shadow-lg animate-float-card">
      <div class="flex items-center gap-4 mb-4">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-[#00ffff] to-[#0f3460] flex items-center justify-center text-2xl border border-[#00ffff]/30">
          💰
        </div>
        <div class="font-medium text-cyan-200 cyber-font text-lg">ВЫРУЧКА</div>
      </div>
      <div class="text-3xl font-bold text-white cyber-font" id="revenue">—</div>
      <div class="mt-3 text-sm font-medium text-green-400 flex items-center gap-2">
        <span>+12%</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 9.707a1 1 0 010-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 01-1.414 1.414L11 7.414V15a1 1 0 11-2 0V7.414L6.707 9.707a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
      </div>
    </div>

    <div class="card-glow bg-gradient-to-br from-[#16213e] to-[#0f3460] rounded-2xl p-6 border border-[#0f3460] shadow-lg animate-float-card">
      <div class="flex items-center gap-4 mb-4">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-[#bf00ff] to-[#0f3460] flex items-center justify-center text-2xl border border-[#bf00ff]/30">
          📈
        </div>
        <div class="font-medium text-purple-200 cyber-font text-lg">ПРИБЫЛЬ</div>
      </div>
      <div class="text-3xl font-bold text-white cyber-font" id="profit">—</div>
      <div class="mt-3 text-sm font-medium text-green-400 flex items-center gap-2">
        <span>+8%</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 9.707a1 1 0 010-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 01-1.414 1.414L11 7.414V15a1 1 0 11-2 0V7.414L6.707 9.707a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
      </div>
    </div>

    <div class="card-glow bg-gradient-to-br from-[#0f0f23] to-[#16213e] rounded-2xl p-6 border border-[#0f3460] shadow-lg animate-float-card">
      <div class="flex items-center gap-4 mb-4">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-[#ff00ff] to-[#0f3460] flex items-center justify-center text-2xl border border-[#ff00ff]/30">
          🧾
        </div>
        <div class="font-medium text-pink-200 cyber-font text-lg">ЧЕКИ</div>
      </div>
      <div class="text-3xl font-bold text-white cyber-font" id="checks">—</div>
      <div class="mt-3 text-sm font-medium text-gray-400 flex items-center gap-2">
        <span>±0%</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" />
        </svg>
      </div>
    </div>

    <div class="card-glow bg-gradient-to-br from-[#1a1a2e] to-[#0f0f23] rounded-2xl p-6 border border-[#0f3460] shadow-lg animate-float-card">
      <div class="flex items-center gap-4 mb-4">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-[#00ffff] to-[#16213e] flex items-center justify-center text-2xl border border-[#00ffff]/30">
          ⚖️
        </div>
        <div class="font-medium text-cyan-200 cyber-font text-lg">МАРЖА</div>
      </div>
      <div class="text-3xl font-bold text-white cyber-font" id="margin">—</div>
      <div class="mt-3 text-sm font-medium text-green-400 flex items-center gap-2">
        <span>+2.1 п.п.</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 9.707a1 1 0 010-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 01-1.414 1.414L11 7.414V15a1 1 0 11-2 0V7.414L6.707 9.707a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
      </div>
    </div>
  </section>

  <!-- Chart Placeholder -->
  <section class="bg-gradient-to-br from-[#16213e] to-[#0f0f23] p-6 rounded-2xl border border-[#0f3460] shadow-lg card-glow">
    <h2 class="text-xl font-bold cyber-font text-cyan-300 mb-4">ДИНАМИКА ВЫРУЧКИ ПО ДНЯМ</h2>
    <div class="h-72 bg-gradient-to-br from-[#0f0f23] to-[#1a1a2e] rounded-xl flex items-center justify-center border border-dashed border-[#0f3460]">
      <p class="text-center text-cyan-200 cyber-font text-lg">
        ГРАФИК БУДЕТ ПОДКЛЮЧЕН<br />
        <span class="text-sm text-gray-500">(ИНТЕГРАЦИЯ С МОЙСКЛАД)</span>
      </p>
    </div>
  </section>
</main>

<footer class="py-5 text-center text-gray-500 text-sm border-t border-[#0f3460] bg-gradient-to-r from-[#0f0f23] to-[#1a1a2e]">
  <p class="cyber-font">© 2026 ТАБАЧНЫЙ МАГАЗИН. ДАННЫЕ ОБНОВЛЯЮТСЯ АВТОМАТИЧЕСКИ ИЗ МОЙСКЛАД.</p>
</footer>

<script>
  // Установка дат по умолчанию
  const today = new Date().toISOString().split('T')[0];
  const startOfWeek = new Date();
  startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay() + 1);
  document.getElementById('start-date').value = startOfWeek.toISOString().split('T')[0];
  document.getElementById('end-date').value = today;

  // Обработчик кнопки
  document.getElementById('apply-btn').addEventListener('click', function () {
    const start = document.getElementById('start-date').value;
    const end = document.getElementById('end-date').value;
    if (!start || !end) {
      alert('Выберите период');
      return;
    }

    // Заглушка данных
    document.getElementById('revenue').textContent = '152 450 ₽';
    document.getElementById('profit').textContent = '48 780 ₽';
    document.getElementById('checks').textContent = '127';
    document.getElementById('margin').textContent = '32.0%';

    this.textContent = 'ГОТОВО';
    this.classList.add('bg-gradient-to-r', 'from-green-600', 'to-emerald-600');
    this.classList.remove('btn-cyber');
    setTimeout(() => {
      this.textContent = 'ПРИМЕНИТЬ';
      this.classList.remove('from-green-600', 'to-emerald-600');
      this.classList.add('btn-cyber');
    }, 2000);
  });
</script>
</body>
</html>
