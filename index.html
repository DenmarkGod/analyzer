<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика Табачного Магазина</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Аналитика Табачного Магазина</h1>
    </header>

    <section class="date-selector">
        <div class="date-inputs">
            <div class="input-group">
                <label for="start-date">Дата начала:</label>
                <input type="date" id="start-date" name="start-date">
            </div>
            <div class="input-group">
                <label for="end-date">Дата окончания:</label>
                <input type="date" id="end-date" name="end-date">
            </div>
            <button id="fetch-data-btn">Получить данные</button>
        </div>
    </section>

    <section class="metrics-section">
        <h2>Показатели за период</h2>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-icon icon-revenue"></div>
                <div class="metric-title">Выручка</div>
                <div class="metric-value" id="revenue-value">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon icon-profit"></div>
                <div class="metric-title">Прибыль</div>
                <div class="metric-value" id="profit-value">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon icon-checks"></div>
                <div class="metric-title">Количество чеков</div>
                <div class="metric-value" id="checks-count-value">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon icon-margin"></div>
                <div class="metric-title">Маржа (%)</div>
                <div class="metric-value" id="margin-value">--</div>
            </div>
        </div>
    </section>
</div>

<script>
    // Заглушка для получения данных из API (пока не реализовано)
    document.getElementById('fetch-data-btn').addEventListener('click', function() {
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;

        if (!startDate || !endDate) {
            alert('Пожалуйста, выберите обе даты.');
            return;
        }

        // Здесь будет вызов API МойСклад
        console.log(`Запрос данных с ${startDate} по ${endDate}`);

        // Пока просто обновим значения заглушками
        document.getElementById('revenue-value').textContent = '150 000 ₽';
        document.getElementById('profit-value').textContent = '45 000 ₽';
        document.getElementById('checks-count-value').textContent = '120';
        document.getElementById('margin-value').textContent = '30%';

        // В будущем здесь будет логика обработки ответа от API
    });

    // Установим сегодняшнюю дату как конечную по умолчанию
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('end-date').value = today;

    // Установим начало недели как начальную дату по умолчанию
    const startOfWeek = new Date();
    startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay() + 1); // Понедельник
    document.getElementById('start-date').value = startOfWeek.toISOString().split('T')[0];
</script>

</body>
</html>
