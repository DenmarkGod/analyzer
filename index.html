<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Аналитика | Табачный Магазин</title>

  <!-- Inter + Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark': '#000000',
            'gray-900': '#111827',
            'blue-600': '#3b82f6',
            'blue-700': '#2563eb',
          },
          animation: {
            'fade-in': 'fadeIn 0.8s ease-out forwards',
            'pulse-slow': 'pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0, transform: 'translateY(20px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-8px)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000;
      color: #fff;
      overflow-x: hidden;
    }

    .hero-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .hero-bg::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
      transform: rotate(30deg);
      animation: float 12s linear infinite;
    }

    .hero-bg::after {
      content: '';
      position: absolute;
      bottom: -50%;
      right: -50%;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
      transform: rotate(-30deg);
      animation: float 15s linear infinite reverse;
    }

    .nav-link {
      font-weight: 500;
      color: #cbd5e1;
      transition: color 0.3s;
    }
    .nav-link:hover {
      color: #fff;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      transition: all 0.4s ease;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5);
    }

    .metric-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .metric-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .section-title {
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #fff, #e5e7eb);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 768px) {
      .section-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body class="min-h-screen">

<!-- Абстрактный фон -->
<div class="hero-bg"></div>

<!-- Header -->
<header class="relative z-10 py-6 px-6 max-w-7xl mx-auto flex justify-between items-center">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-lg bg-gradient-to-r from-blue-600 to-blue-700 flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" class="w-5 h-5">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
    </div>
    <span class="font-bold text-xl">Аналитика</span>
  </div>

  <nav class="hidden md:flex gap-8">
    <a href="#" class="nav-link">Услуги</a>
    <a href="#" class="nav-link">Кейсы</a>
    <a href="#" class="nav-link">Преимущества</a>
    <a href="#" class="nav-link">Отзывы</a>
    <a href="#" class="nav-link">Контакты</a>
  </nav>

  <button class="btn-primary hidden md:block">
    Написать нам
  </button>

  <!-- Мобильная кнопка -->
  <button class="btn-primary md:hidden w-10 h-10 flex items-center justify-center">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M3 5a2 2 0 012-2h10a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V5zm11 1H6v8h8V6z" clip-rule="evenodd" />
    </svg>
  </button>
</header>

<!-- Hero Section -->
<section class="relative z-10 py-20 px-6 max-w-7xl mx-auto text-center">
  <h1 class="section-title mb-6 animate-fade-in">
    Запускаем продукты,<br>которые продают
  </h1>
  <p class="text-gray-300 max-w-3xl mx-auto text-lg mb-10 animate-fade-in" style="animation-delay: 0.2s">
    Комплексные IT-решения для бизнеса: сайт, бренд и аналитика, которые повышают эффективность
  </p>
  <button class="btn-primary animate-fade-in" style="animation-delay: 0.4s">
    Обсудить проект
    <svg xmlns="http://www.w3.org/2000/svg" class="inline ml-2 h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L12.586 11H5a1 1 0 110-2h7.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd" />
    </svg>
  </button>
</section>

<!-- Metrics Section -->
<section class="relative z-10 py-20 px-6 max-w-7xl mx-auto">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <div class="metric-card p-8 animate-fade-in" style="animation-delay: 0.1s">
      <div class="text-4xl font-bold mb-2">152 450 ₽</div>
      <div class="text-gray-400">Выручка за период</div>
    </div>
    <div class="metric-card p-8 animate-fade-in" style="animation-delay: 0.2s">
      <div class="text-4xl font-bold mb-2">48 780 ₽</div>
      <div class="text-gray-400">Прибыль</div>
    </div>
    <div class="metric-card p-8 animate-fade-in" style="animation-delay: 0.3s">
      <div class="text-4xl font-bold mb-2">127</div>
      <div class="text-gray-400">Чеков</div>
    </div>
    <div class="metric-card p-8 animate-fade-in" style="animation-delay: 0.4s">
      <div class="text-4xl font-bold mb-2">32.0%</div>
      <div class="text-gray-400">Маржа</div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="relative z-10 py-10 px-6 border-t border-gray-800 max-w-7xl mx-auto text-center text-gray-500 text-sm">
  <p>© 2026 Табачный магазин. Все права защищены.</p>
</footer>

<script>
  // Простая анимация появления при прокрутке (без библиотек)
  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('animate-fade-in');
        }
      });
    },
    { threshold: 0.1 }
  );

  document.querySelectorAll('.metric-card').forEach(card => {
    observer.observe(card);
  });
</script>
</body>
</html>
