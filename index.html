<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Аналитика | Табачный Магазин</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            success: '#10b981',
          }
        }
      }
    }
  </script>

  <!-- Framer Motion via CDN -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/motion.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors">

<div class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="p-6 bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-2xl font-bold">Аналитика продаж</h1>
      <p class="text-gray-600 dark:text-gray-400 mt-1">Табачный магазин • Отчёт за период</p>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 p-6 max-w-7xl mx-auto">
    <!-- Controls -->
    <section class="mb-8 bg-white dark:bg-gray-800 p-6 rounded-xl shadow-md border border-gray-200 dark:border-gray-700">
      <div class="flex flex-wrap items-center gap-4">
        <div class="flex items-center gap-3">
          <label class="text-gray-600 dark:text-gray-400 font-medium">Период:</label>
          <div class="flex items-center gap-2">
            <input type="date" id="start-date" class="p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600" />
            <span class="text-gray-500">—</span>
            <input type="date" id="end-date" class="p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600" />
          </div>
        </div>
        <button id="apply-btn" class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition-colors shadow-sm">
          Применить
        </button>
      </div>
    </section>

    <!-- Metrics Grid -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <motion-div
        class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-md transition-shadow"
        initial="{ y: 50, opacity: 0 }"
        animate="{ y: 0, opacity: 1 }"
        transition="{ type: 'spring', bounce: 0.2, duration: 0.8 }"
      >
        <div class="flex items-center gap-3 mb-3">
          <div class="text-2xl">💰</div>
          <div class="font-medium text-gray-600 dark:text-gray-300">Выручка</div>
        </div>
        <div class="text-2xl font-bold text-gray-900 dark:text-white" id="revenue">—</div>
        <div class="mt-1 text-sm text-green-500">+12% к прошлому периоду</div>
      </motion-div>

      <motion-div
        class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-md transition-shadow"
        initial="{ y: 50, opacity: 0 }"
        animate="{ y: 0, opacity: 1 }"
        transition="{ type: 'spring', bounce: 0.2, duration: 0.8, delay: 0.1 }"
      >
        <div class="flex items-center gap-3 mb-3">
          <div class="text-2xl">📈</div>
          <div class="font-medium text-gray-600 dark:text-gray-300">Прибыль</div>
        </div>
        <div class="text-2xl font-bold text-gray-900 dark:text-white" id="profit">—</div>
        <div class="mt-1 text-sm text-green-500">+8%</div>
      </motion-div>

      <motion-div
        class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-md transition-shadow"
        initial="{ y: 50, opacity: 0 }"
        animate="{ y: 0, opacity: 1 }"
        transition="{ type: 'spring', bounce: 0.2, duration: 0.8, delay: 0.2 }"
      >
        <div class="flex items-center gap-3 mb-3">
          <div class="text-2xl">🧾</div>
          <div class="font-medium text-gray-600 dark:text-gray-300">Чеки</div>
        </div>
        <div class="text-2xl font-bold text-gray-900 dark:text-white" id="checks">—</div>
        <div class="mt-1 text-sm text-gray-500">±0%</div>
      </motion-div>

      <motion-div
        class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-md transition-shadow"
        initial="{ y: 50, opacity: 0 }"
        animate="{ y: 0, opacity: 1 }"
        transition="{ type: 'spring', bounce: 0.2, duration: 0.8, delay: 0.3 }"
      >
        <div class="flex items-center gap-3 mb-3">
          <div class="text-2xl">⚖️</div>
          <div class="font-medium text-gray-600 dark:text-gray-300">Маржа</div>
        </div>
        <div class="text-2xl font-bold text-gray-900 dark:text-white" id="margin">—</div>
        <div class="mt-1 text-sm text-green-500">+2.1 п.п.</div>
      </motion-div>
    </section>

    <!-- Chart Placeholder -->
    <section class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-md border border-gray-200 dark:border-gray-700">
      <h2 class="text-lg font-semibold mb-4">Динамика выручки по дням</h2>
      <div class="h-64 bg-gray-100 dark:bg-gray-700 rounded-lg flex items-center justify-center">
        <p class="text-gray-500 dark:text-gray-400">График будет подключен позже</p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-gray-600 dark:text-gray-400 text-sm border-t border-gray-200 dark:border-gray-700">
    © 2026 Табачный магазин. Данные обновляются автоматически из МойСклад.
  </footer>
</div>

<script>
  // Установка дат по умолчанию
  const today = new Date().toISOString().split('T')[0];
  const startOfWeek = new Date();
  startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay() + 1);
  document.getElementById('start-date').value = startOfWeek.toISOString().split('T')[0];
  document.getElementById('end-date').value = today;

  // Обработчик кнопки
  document.getElementById('apply-btn').addEventListener('click', function () {
    const start = document.getElementById('start-date').value;
    const end = document.getElementById('end-date').value;
    if (!start || !end) {
      alert('Выберите период');
      return;
    }

    // Заглушка данных
    document.getElementById('revenue').textContent = '152 450 ₽';
    document.getElementById('profit').textContent = '48 780 ₽';
    document.getElementById('checks').textContent = '127';
    document.getElementById('margin').textContent = '32.0%';

    this.textContent = 'Готово';
    this.classList.add('bg-green-600');
    setTimeout(() => {
      this.textContent = 'Применить';
      this.classList.remove('bg-green-600');
    }, 2000);
  });
</script>
