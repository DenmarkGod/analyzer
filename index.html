<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика | Табачный Магазин</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
    <header class="header">
        <div class="logo">
            <div class="logo-icon">📊</div>
            <h1>Аналитика продаж</h1>
        </div>
        <div class="subtitle">Табачный магазин • Отчёт за период</div>
    </header>

    <main class="main">
        <section class="controls">
            <div class="date-range">
                <label class="label">Период:</label>
                <div class="date-inputs">
                    <input type="date" id="start-date" class="date-input">
                    <span class="divider">—</span>
                    <input type="date" id="end-date" class="date-input">
                </div>
            </div>
            <button id="apply-btn" class="btn btn-primary">
                Применить
            </button>
        </section>

        <section class="metrics-grid">
            <div class="metric-card animate-in" data-delay="0.1s">
                <div class="metric-header">
                    <div class="metric-icon">💰</div>
                    <div class="metric-title">Выручка</div>
                </div>
                <div class="metric-value" id="revenue">—</div>
                <div class="metric-change positive">+12% к прошлому периоду</div>
            </div>

            <div class="metric-card animate-in" data-delay="0.2s">
                <div class="metric-header">
                    <div class="metric-icon">📈</div>
                    <div class="metric-title">Прибыль</div>
                </div>
                <div class="metric-value" id="profit">—</div>
                <div class="metric-change positive">+8%</div>
            </div>

            <div class="metric-card animate-in" data-delay="0.3s">
                <div class="metric-header">
                    <div class="metric-icon">🧾</div>
                    <div class="metric-title">Чеки</div>
                </div>
                <div class="metric-value" id="checks">—</div>
                <div class="metric-change neutral">±0%</div>
            </div>

            <div class="metric-card animate-in" data-delay="0.4s">
                <div class="metric-header">
                    <div class="metric-icon">⚖️</div>
                    <div class="metric-title">Маржа</div>
                </div>
                <div class="metric-value" id="margin">—</div>
                <div class="metric-change positive">+2.1 п.п.</div>
            </div>
        </section>

        <section class="chart-placeholder">
            <div class="chart-title">Динамика выручки по дням</div>
            <div class="chart-bg">
                <svg viewBox="0 0 800 200" preserveAspectRatio="none">
                    <path d="M0,150 Q100,50 200,100 T400,80 T600,120 T800,100" 
                          fill="none" stroke="var(--border-color)" stroke-width="2"/>
                    <circle cx="100" cy="50" r="4" fill="var(--primary-color)"/>
                    <circle cx="200" cy="100" r="4" fill="var(--primary-color)"/>
                    <circle cx="300" cy="90" r="4" fill="var(--primary-color)"/>
                    <circle cx="400" cy="80" r="4" fill="var(--primary-color)"/>
                    <circle cx="500" cy="110" r="4" fill="var(--primary-color)"/>
                    <circle cx="600" cy="120" r="4" fill="var(--primary-color)"/>
                    <circle cx="700" cy="110" r="4" fill="var(--primary-color)"/>
                    <circle cx="800" cy="100" r="4" fill="var(--primary-color)"/>
                </svg>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Табачный магазин. Данные обновляются автоматически из МойСклад.</p>
    </footer>
</div>

<script>
    // Заглушка: имитация загрузки данных
    document.getElementById('apply-btn').addEventListener('click', function () {
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;

        if (!startDate || !endDate) {
            alert('Выберите период');
            return;
        }

        // Анимация "загрузки"
        const btn = this;
        btn.textContent = 'Загрузка...';
        btn.disabled = true;

        setTimeout(() => {
            // Обновляем значения
            document.getElementById('revenue').textContent = '152 450 ₽';
            document.getElementById('profit').textContent = '48 780 ₽';
            document.getElementById('checks').textContent = '127';
            document.getElementById('margin').textContent = '32.0%';

            btn.textContent = 'Готово';
            btn.classList.add('btn-success');
            setTimeout(() => {
                btn.textContent = 'Применить';
                btn.classList.remove('btn-success');
                btn.disabled = false;
            }, 2000);
        }, 1200);
    });

    // Установка дат по умолчанию: начало недели — сегодня
    const today = new Date();
    const startOfWeek = new Date(today);
    startOfWeek.setDate(today.getDate() - today.getDay() + 1); // Понедельник

    document.getElementById('start-date').value = startOfWeek.toISOString().split('T')[0];
    document.getElementById('end-date').value = today.toISOString().split('T')[0];

    // Анимация появления карточек при прокрутке
    const observer = new IntersectionObserver(
        (entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        },
        { threshold: 0.1 }
    );

    document.querySelectorAll('.metric-card').forEach(card => {
        observer.observe(card);
    });
</script>
</body>
</html>
